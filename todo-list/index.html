<!DOCTYPE html>
<html lang="ka" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="საბა - Junior Web Developer პორტფოლიო, შექმნილი React-ის მოდულარული კომპონენტებითა და Tailwind CSS-ით" />
  <title>საბა | React Portfolio</title>

  <!-- Google Fonts: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <!-- Font Awesome 6.5.1 CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif'],
          },
          colors: {
            brand: {
              50: '#eff6ff',
              100: '#dbeafe',
              200: '#bfdbfe',
              500: '#3b82f6',
              600: '#2563eb',
              700: '#1d4ed8',
              800: '#1e40af',
            }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen antialiased">
  <div id="root"></div>

  <!-- 1. Vite Dev Server Entry (Runs when starting dev server via 'npm run dev') -->
  <script type="module" src="/src/main.tsx"></script>

  <!-- 2. Live Server Fallback (Runs if opened directly or via VS Code Live Server) -->
  <script>
    (function() {
      setTimeout(function() {
        var root = document.getElementById('root');
        if (root && root.children.length === 0) {
          console.warn('Vite Dev Server is not active. Loading compiled production bundle...');
          var bundleScript = document.createElement('script');
          bundleScript.type = 'module';
          bundleScript.crossOrigin = 'anonymous';
          bundleScript.src = './dist/assets/index.js';
          bundleScript.onerror = function() {
            showNotice();
          };
          document.body.appendChild(bundleScript);

          var bundleCss = document.createElement('link');
          bundleCss.rel = 'stylesheet';
          bundleCss.crossOrigin = 'anonymous';
          bundleCss.href = './dist/assets/index.css';
          document.head.appendChild(bundleCss);

          setTimeout(function() {
            if (root && root.children.length === 0) {
              showNotice();
            }
          }, 1200);
        }
      }, 500);

      function showNotice() {
        var root = document.getElementById('root');
        if (!root || root.children.length > 0) return;
        root.innerHTML = `
          <div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; font-family: 'Plus Jakarta Sans', system-ui, sans-serif;">
            <div style="max-width: 580px; width: 100%; background: #ffffff; border: 1px solid #e2e8f0; border-radius: 20px; padding: 32px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1); text-align: center;">
              <div style="width: 56px; height: 56px; margin: 0 auto 16px; background: #eff6ff; color: #2563eb; border-radius: 16px; display: flex; align-items: center; justify-content: center; font-size: 24px;">
                ⚡
              </div>
              <h2 style="font-size: 20px; font-weight: 800; color: #0f172a; margin-bottom: 8px;">
                როგორ გავუშვათ React პროექტი
              </h2>
              <p style="color: #64748b; font-size: 14px; line-height: 1.6; margin-bottom: 20px;">
                React + TypeScript პროექტი მოითხოვს <strong>Vite</strong> დეველოპმენტ სერვერს. VS Code-ის ჩვეულებრივი <strong>Live Server (Go Live)</strong> ვერ ახდენს TypeScript-ისა და JSX კომპონენტების კომპილაციას რეალურ დროში.
              </p>
              <div style="background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 12px; padding: 16px; text-align: left; margin-bottom: 20px; font-family: monospace; font-size: 13px; color: #1e293b;">
                <p style="margin: 0 0 6px 0; color: #64748b;">// ტერმინალში გაუშვით შემდეგი ბრძანებები:</p>
                <p style="margin: 0 0 4px 0; font-weight: bold; color: #2563eb;">cd todo-list</p>
                <p style="margin: 0; font-weight: bold; color: #059669;">npm run dev</p>
              </div>
              <p style="color: #64748b; font-size: 13px; margin-bottom: 20px;">
                ან თუ გსურთ Live Server-ით ნახვა, გახსენით უკვე დაკომპილირებული ფაილი: <strong>todo-list/dist/index.html</strong>
              </p>
              <a href="./dist/index.html" style="display: inline-block; background: #2563eb; color: #ffffff; font-weight: 700; font-size: 14px; padding: 12px 24px; border-radius: 12px; text-decoration: none; box-shadow: 0 4px 12px rgba(37,99,235,0.25);">
                👉 გახსენით დაკომპილირებული ვერსია (dist/index.html)
              </a>
            </div>
          </div>
        `;
      }
    })();
  </script>
</body>
</html>
